# Supabase CLI project config.
#
# The only thing here that isn't a default: the Stripe webhook and the usage
# reporter must run with JWT verification off, because Stripe and a cron
# scheduler don't carry a Supabase token. They protect themselves instead —
# the webhook by signature, the reporter by a shared header token.

project_id = "looseleaf"

[functions.partner-checkout]
verify_jwt = true

[functions.partner-portal]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.partner-report-usage]
verify_jwt = false
