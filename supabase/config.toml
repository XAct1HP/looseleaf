# Supabase CLI project config.
#
# The only thing here that isn't a default: the Stripe webhook and the metering
# worker must run with JWT verification off, because Stripe and a cron
# scheduler don't carry a Supabase token. They protect themselves instead —
# the webhook by signature, the worker by a shared header token.

project_id = "looseleaf"

[functions.partner-billing-setup]
verify_jwt = true

[functions.partner-portal]
verify_jwt = true

[functions.partner-billing-sync]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.partner-meter-redemptions]
verify_jwt = false

# Deleting an account is only ever the signed-in person deleting their own,
# so the platform's own token check is the first gate and the RPCs are the
# second.
[functions.delete-account]
verify_jwt = true
