<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFDF8" />

    <title>Looseleaf — Meet someone worth keeping.</title>
    <meta
      name="description"
      content="Dating at college should be easier. Meet people from your campus, see who likes you, and actually make plans. No subscriptions. No boosts. No games."
    />
    <link rel="canonical" href="https://hellolooseleaf.com/" />

    <!-- Share cards. Absolute URLs are required: Facebook, iMessage, Slack and
         the rest fetch these server-side, where a relative path means nothing.
         Keep the domain in sync with VITE_SITE_URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Looseleaf" />
    <meta property="og:url" content="https://hellolooseleaf.com/" />
    <meta property="og:title" content="Looseleaf — Meet someone worth keeping." />
    <meta
      property="og:description"
      content="Dating at college should be easier. Meet people from your campus, see who likes you, and actually make plans. No subscriptions. No boosts. No games."
    />
    <meta property="og:image" content="https://hellolooseleaf.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Looseleaf — meet someone worth keeping." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Looseleaf — Meet someone worth keeping." />
    <meta
      name="twitter:description"
      content="Dating at college should be easier. Free, and staying that way."
    />
    <meta name="twitter:image" content="https://hellolooseleaf.com/og.png" />

    <!-- Home screen. iOS ignores SVG for apple-touch-icon, so that one is a PNG. -->
    <link rel="icon" type="image/svg+xml" href="/leaf.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Looseleaf" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
